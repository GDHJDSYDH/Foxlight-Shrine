<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#ffd57a" stop-opacity="0.72"/>
      <stop offset="55%" stop-color="#ff8c2e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0d111e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="paperGlow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#fff9db"/>
      <stop offset="55%" stop-color="#ffca64"/>
      <stop offset="100%" stop-color="#d97524"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a3324"/>
      <stop offset="100%" stop-color="#2b1712"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#101526"/>
  <circle cx="64" cy="66" r="56" fill="url(#bgGlow)"/>
