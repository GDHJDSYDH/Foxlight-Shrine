  <rect x="38" y="42" width="52" height="54" rx="4" fill="url(#paperGlow)" stroke="#4c281d" stroke-width="4"/>
  <!-- Lattice bars -->
  <line x1="64" y1="42" x2="64" y2="96" stroke="#4c281d" stroke-width="3"/>
  <line x1="38" y1="60" x2="90" y2="60" stroke="#4c281d" stroke-width="2.5"/>
  <line x1="38" y1="78" x2="90" y2="78" stroke="#4c281d" stroke-width="2.5"/>
  <!-- Flame core -->
  <path d="M64 56 Q72 67 64 76 Q56 67 64 56 Z" fill="#fffdf0"/>
  <!-- Base stand -->
  <rect x="30" y="96" width="68" height="10" rx="3" fill="url(#wood)" stroke="#8a3c2d" stroke-width="2"/>
  <rect x="36" y="106" width="10" height="8" rx="2" fill="#2b1712"/>
  <rect x="82" y="106" width="10" height="8" rx="2" fill="#2b1712"/>
